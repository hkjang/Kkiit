openapi: 3.1.0
info:
  title: Kkiit Marketplace API
  version: 0.4.0
  description: Kkiit 재능·AI 서비스 마켓플레이스 REST API
servers:
  - url: /api/v1
security:
  - cookieSession: []
  - bearerApiKey: []
paths:
  /version:
    get:
      security: []
      summary: 서비스 빌드 버전
      responses:
        '200': { description: version information }
  /features:
    get:
      security: []
      summary: 사용 가능한 기능 목록
      description: 배포에서 끈 기능을 화면에서 감추기 위해 사용한다. 끈 기능의 API는 별도로 거부한다.
      responses:
        '200': { description: feature switches }
  /auth/logout:
    post:
      summary: 현재 세션 종료
      responses:
        '204': { description: session revoked }
  /auth/oauth/{slug}/start:
    get:
      security: []
      summary: 소셜·OIDC 로그인 시작
      description: |
        제공자의 인가 화면으로 리다이렉트한다. `link=1`이면 로그인 대신 현재 계정에 연결하는 흐름으로 진행한다.
        `prompt=none`은 제공자 세션이 있을 때만 화면 없이 로그인하는 조용한 시도이며, 그 제공자의 `auto_login` 옵션이 켜져 있을 때만 전달된다 — 꺼져 있으면 평범한 로그인으로 바뀐다.
        `return_to`는 로그인 뒤 돌아갈 같은 출처의 경로로, `/`로 시작하고 `//`로 시작하지 않는 값만 받는다.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: link, in: query, schema: { type: string, enum: ['1'] } }
        - { name: prompt, in: query, schema: { type: string, enum: ['none'] } }
        - { name: return_to, in: query, schema: { type: string } }
      responses:
        '302': { description: redirect to the provider }
        '404': { $ref: '#/components/responses/Error' }
  /auth/oauth/{slug}/callback:
    get:
      security: []
      summary: 소셜·OIDC 로그인 콜백
      description: |
        제공자가 돌려보낸 code와 state를 검증한다. state는 1회용이며 만료된다.
        성공하면 시작할 때 받은 `return_to`로 돌아간다. 조용한 시도(`prompt=none`)가 `error=login_required`로 거절되면 실패가 아니라 세션이 없다는 대답이므로 `/login?sso=none`으로 보내고, 그 표시를 본 브라우저는 다시 시도하지 않는다.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '302': { description: redirect back into the application }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/providers:
    get:
      security: []
      summary: 활성 로그인 제공자
      description: 각 항목의 `auto_login`은 관리자가 그 제공자에 조용한 로그인(`prompt=none`)을 켰는지 알려 주며, 브라우저는 로그인 화면을 그리기 전에 이것을 보고 시도 여부를 정한다.
      responses:
        '200': { description: enabled providers }
  /auth/login:
    post:
      security: []
      summary: 로컬 로그인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200': { description: login success }
        '401': { $ref: '#/components/responses/Error' }
  /auth/register:
    post:
      security: []
      summary: 공개 가입 정책에 따른 로컬 계정 가입
      responses:
        '201': { description: registered and signed in }
  /me/seller-profile:
    get:
      summary: 내 판매자 프로필
      responses:
        '200': { description: seller profile or disabled state }
    put:
      summary: 판매자 프로필 활성화 또는 변경
      responses:
        '200': { description: seller profile enabled }
  /me:
    get:
      summary: 현재 사용자와 유효 권한
      responses:
        '200': { description: principal }
    patch:
      summary: 개인 프로필 변경
      responses:
        '200': { description: updated }
  /me/organizations:
    get:
      summary: 내가 속한 조직과 역할
      responses:
        '200': { description: organizations with the caller's role }
  /me/reports:
    get:
      summary: 내 신고 내역
      parameters: [{ $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { description: reports with their state and resolution }
  /me/settlements:
    get:
      summary: 내 정산 내역과 수익 요약
      description: 판매자 본인의 정산만 반환하며 보류 사유와 지급 예정일을 포함한다.
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [scheduled, confirmed, hold, completed, cancelled] } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: settlements with next_cursor and an earnings summary }
        '403': { $ref: '#/components/responses/Error' }
  /me/favorites:
    get:
      summary: 찜한 서비스 목록
      parameters: [{ $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { description: saved talents with seller trust information }
  /me/files:
    post:
      summary: 공개 미디어 업로드
      description: 포트폴리오처럼 방문자에게 보여줄 파일을 공개 표시로 저장한다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201': { description: stored file with a download url }
        '413': { $ref: '#/components/responses/Error' }
  /me/portfolios:
    get:
      summary: 내 포트폴리오
      responses:
        '200': { description: portfolios }
    post:
      summary: 포트폴리오 등록
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortfolioInput' }
      responses:
        '201': { description: created }
        '400': { $ref: '#/components/responses/Error' }
  /me/portfolios/{id}:
    put:
      summary: 포트폴리오 수정
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortfolioInput' }
      responses:
        '200': { description: updated }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: 포트폴리오 삭제
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: deleted }
  /me/notifications:
    get:
      summary: 내 알림함
      parameters:
        - { name: unread, in: query, schema: { type: boolean }, description: 읽지 않은 알림만 조회 }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: notifications with unread count }
  /me/notifications/read:
    post:
      summary: 알림 읽음 처리
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, items: { type: string, format: uuid } }
                all: { type: boolean, description: 읽지 않은 알림 전체를 읽음 처리 }
      responses:
        '200': { description: remaining unread count }
        '400': { $ref: '#/components/responses/Error' }
  /me/notifications/ws:
    get:
      summary: 알림함 실시간 스트림
      description: WebSocket 업그레이드. 알림이 생기면 `notification.created` 프레임을 보낸다.
      responses:
        '101': { description: switching protocols }
  /me/notification-preferences:
    get:
      summary: 이벤트별 알림 수신 설정
      responses:
        '200': { description: preferences for every catalog event }
    put:
      summary: 이벤트별 알림 수신 설정 변경
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [event_type, enabled]
                    properties:
                      event_type: { type: string }
                      channels: { type: array, items: { type: string } }
                      enabled: { type: boolean }
      responses:
        '200': { description: saved }
        '400': { $ref: '#/components/responses/Error' }
  /me/webhooks:
    get:
      summary: 내 이벤트 웹훅 목록
      responses:
        '200': { description: webhooks and the subscribable event catalog }
    post:
      summary: 이벤트 웹훅 등록
      description: 서명 키 원문은 이 응답에서 한 번만 반환된다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookInput' }
      responses:
        '201': { description: created webhook with one-time signing secret }
        '400': { $ref: '#/components/responses/Error' }
  /me/webhooks/{id}:
    put:
      summary: 이벤트 웹훅 변경
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookInput' }
      responses:
        '200': { description: updated, includes a new secret when rotated }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: 이벤트 웹훅 삭제
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: deleted }
  /me/webhooks/{id}/test:
    post:
      summary: 웹훅 테스트 이벤트 전송
      description: 실제 이벤트와 같은 서명·재시도 경로로 `WebhookTest` 이벤트를 큐에 넣는다.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '202': { description: queued }
        '409': { $ref: '#/components/responses/Error' }
  /me/webhooks/{id}/deliveries:
    get:
      summary: 웹훅 전달 이력
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: delivery attempts }
  /me/webhooks/{id}/deliveries/{deliveryId}/retry:
    post:
      summary: 실패한 전달 재전송
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: deliveryId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: requeued }
        '404': { $ref: '#/components/responses/Error' }
  /me/api-keys:
    get:
      summary: 개인 API Key 목록
      responses:
        '200': { description: keys without secrets }
    post:
      summary: 개인 API Key 발급
      description: Secret 원문은 이 응답에서 한 번만 반환된다.
      responses:
        '201': { description: created key with one-time secret }
  /me/api-keys/{id}/rotate:
    post:
      summary: API Key 원자적 회전
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '201': { description: rotated key with one-time secret }
  /me/password:
    post:
      summary: 비밀번호 변경
      description: 현재 비밀번호를 확인하고 교체한 뒤 현재 기기를 제외한 모든 세션을 종료한다. 비밀번호가 없는 소셜 계정은 current_password 없이 설정할 수 있다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password, minLength: 12 }
      responses:
        '200': { description: changed with the number of revoked sessions }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /me/identities:
    get:
      summary: 연결된 로그인 제공자
      responses:
        '200': { description: linked identities and whether a password is set }
  /me/identities/{id}:
    delete:
      summary: 제공자 연결 해제
      description: 계정의 마지막 로그인 수단은 해제할 수 없다.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: unlinked }
        '409': { $ref: '#/components/responses/Error' }
  /me/api-keys/{id}:
    delete:
      summary: API 키 폐기
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: key revoked }
        '404': { $ref: '#/components/responses/Error' }
  /me/sessions:
    get:
      summary: 활성 로그인 목록
      responses:
        '200': { description: active sessions, one flagged as current }
    delete:
      summary: 다른 기기 로그아웃
      responses:
        '200': { description: revoked session count }
  /me/mfa:
    get:
      summary: 내 TOTP MFA 상태
      responses:
        '200': { description: MFA status }
  /me/mfa/totp/setup:
    post:
      summary: 일회 표시 비밀값과 otpauth URI 발급
      responses:
        '201': { description: pending TOTP setup }
  /me/mfa/totp/confirm:
    post:
      summary: 6자리 코드 검증 후 TOTP 활성화
      responses:
        '200': { description: TOTP enabled }
  /me/mfa/totp:
    delete:
      summary: 현재 코드 검증 후 TOTP 해제
      responses:
        '204': { description: TOTP disabled }
  /talents:
    get:
      security: []
      summary: 공개 재능 상품 FTS 검색
      description: 기본 정렬은 search.policy 가중치로 텍스트 적합도, 상품 품질 점수, 최신성을 섞는다. 각 항목은 판매자 등급과 평점을 포함하며, 응답은 `has_more`와 `next_offset`을 함께 돌려준다.
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string }, description: 카테고리 slug. 상위 카테고리를 지정하면 하위 카테고리 상품도 함께 반환한다. }
        - { name: price_min, in: query, schema: { type: integer, minimum: 1 } }
        - { name: price_max, in: query, schema: { type: integer, minimum: 1 } }
        - { name: max_delivery_days, in: query, schema: { type: integer, minimum: 1 } }
        - { name: service_type, in: query, schema: { type: string, enum: [HUMAN, AI, HYBRID] } }
        - { name: sort, in: query, schema: { type: string, enum: [recommended, price_asc, price_desc, delivery, rating, newest] }, description: 지정하지 않으면 추천순. }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 1000 }, description: 순위가 요청마다 계산되므로 커서 대신 offset으로 넘긴다. 1000을 넘는 값은 1000으로 잘린다. }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: talents ordered by the blended rank score }
    post:
      summary: 재능 상품과 패키지, Smart Order Form 등록
      responses:
        '201': { description: draft talent }
  /talents/{id}:
    get:
      security: []
      summary: 재능 상세
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: talent detail }
    put:
      summary: 본인 재능 상품 변경
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: updated }
  /talents/{id}/publish:
    post:
      summary: 재능 공개 또는 승인 요청
      description: 조건과 일치하는 활성 talent_publish 정책이 없으면 즉시 공개한다.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: published or review_pending }
  /me/talents:
    get:
      summary: 내 상품 목록과 성과
      description: 상품마다 최근 30일 조회수·주문수·전환율, 누적 주문과 완료 건수, 찜 수를 함께 반환한다. 조회가 없으면 전환율은 `null`이다.
      responses:
        '200': { description: my talents with performance figures }
  /me/reviews:
    get:
      summary: 내가 받은 후기
      description: 내 상품에 달린 후기를 최신순 커서 페이징으로 반환한다. 각 항목에 상품과 주문 번호가 함께 오며, 응답의 `unanswered`는 아직 답글을 남기지 않은 건수다. `unanswered=1`이면 답글 없는 것만 반환한다.
      parameters:
        - { name: unanswered, in: query, schema: { type: string, enum: ['1'] } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: reviews with next_cursor and the unanswered count }
  /reviews/{id}/reply:
    post:
      summary: 리뷰에 대한 판매자 답글
      description: 해당 주문의 판매자만 남길 수 있다. 리뷰 본문과 점수는 바뀌지 않으며 답글은 리뷰 아래에 함께 공개된다. 다시 호출하면 답글을 고친다.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: reply saved }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    delete:
      summary: 판매자 답글 삭제
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: reply removed }
        '403': { $ref: '#/components/responses/Error' }
  /talents/{id}/view:
    post:
      security: []
      summary: 상품 조회 기록
      description: 뷰어당 상품당 하루 한 번만 집계하며 판매자 본인의 조회와 비공개 상품은 세지 않는다. 비로그인 뷰어는 주소를 저장하지 않고 해시로만 구분한다. 실패해도 페이지에는 영향을 주지 않으므로 항상 204를 돌려준다.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: recorded or intentionally ignored }
        '404': { $ref: '#/components/responses/Error' }
  /talents/{id}/status:
    post:
      summary: 판매자가 직접 하는 판매 중지·재개
      description: 본인 상품만 대상으로 한다. `published`↔`paused`, `draft`→`archived`, `archived`→`published`/`paused`/`draft`만 허용한다. 중지는 새 주문만 막고 진행 중인 주문은 그대로 둔다. 재개는 이미 승인된 내용이므로 재검토를 거치지 않으며, 내용을 고치면 수정 경로가 다시 검토로 보낸다.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: status changed }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /orders:
    get:
      summary: 접근 가능한 구매·판매 주문
      description: 본인이 구매자 또는 판매자인 주문을 최신순 커서 페이징으로 반환한다. `orders.manage` 권한이 있으면 전체 주문을 반환한다. 알 수 없는 `state` 값은 필터 없이 무시한다.
      parameters:
        - { name: role, in: query, schema: { type: string, enum: [buyer, seller] } }
        - { name: state, in: query, schema: { type: string }, description: 주문 상태 또는 `OPEN`(종료되지 않은 모든 주문). }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: orders with next_cursor }
    post:
      summary: 공개 상품 주문
      description: 판매자가 정의한 주문 양식을 서버에서 검증한다. 필수 항목이 비어 있으면 400을 돌려주며, 답변은 요구사항 id 또는 label 어느 쪽으로 보내도 되고 저장은 항상 label 기준이다. 양식에 없는 항목은 저장하지 않는다.
      responses:
        '201': { description: created order }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /orders/{id}:
    get:
      summary: 주문 Workspace 데이터와 Timeline
      description: 구매자·판매자·운영자, 그리고 조직 명의 주문이라면 그 조직의 소유자·관리자가 열람합니다. 납기를 넘긴 미납품 주문은 `overdue`와 `overdue_days`를 함께 반환합니다.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: order workspace }
        '404': { $ref: '#/components/responses/Error' }
  /orders/{id}/transition:
    post:
      summary: 허용표 기반 주문 상태 변경
      description: 취소 완료는 원칙적으로 `orders.manage` 권한자의 몫이지만, 납기를 `marketplace.policy.overdue_cancel_days`(기본 7일)만큼 넘긴 미납품 주문은 구매자가 직접 마무리하고 에스크로를 돌려받는다.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: transitioned }
        '409': { $ref: '#/components/responses/Error' }
  /orders/{id}/pay:
    post:
      summary: 결제 Adapter 실행과 에스크로 원장 기록
      description: Idempotency-Key 헤더가 필수이며 현재 기본 Adapter는 관리자 정책에 따른 manual 방식이다.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        '200': { description: payment recorded idempotently }
  /orders/{id}/deliveries:
    post:
      summary: 판매자 납품 등록
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '201': { description: delivery }
  /orders/{id}/revision:
    post:
      summary: 구매자 수정 요청
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '201': { description: revision }
  /orders/{id}/accept:
    post:
      summary: 구매확정 및 정산 원장 생성
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: accepted and settlement scheduled }
  /orders/{id}/messages:
    get:
      summary: 주문 메시지와 읽음 상태 조회
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: messages }
    post:
      summary: 주문 메시지 전송
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '201': { description: message created }
  /orders/{id}/messages/ws:
    get:
      summary: 주문 실시간 메시지 WebSocket
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '101': { description: WebSocket upgraded }
  /orders/{id}/files:
    post:
      summary: 주문 파일 업로드와 SHA-256 무결성 기록
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '201': { description: file metadata and download URL }
  /orders/{id}/review:
    post:
      summary: 완료 주문 다면 리뷰 등록
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '201': { description: review created }
  /ai/talents/draft:
    post:
      summary: AI 또는 오프라인 규칙 기반 재능 상품 초안
      responses:
        '200': { description: structured talent draft and execution mode }
  /ai/requirements/analyze:
    post:
      summary: AI 또는 오프라인 규칙 기반 요구사항 구조화
      responses:
        '200': { description: requirement analysis and completeness score }
  /categories:
    get:
      security: []
      summary: 카테고리 트리
      description: 활성 카테고리를 정렬 순서대로 반환한다. `parent_id`가 비어 있으면 최상위 분류다.
      responses:
        '200': { description: categories }
  /talents/{id}/inquiries:
    post:
      summary: 주문 전 상품 문의
      description: 공개된 상품에만 보낼 수 있고 본인 상품에는 보낼 수 없다. 같은 구매자가 같은 상품에 다시 문의하면 새 스레드가 아니라 기존 대화가 이어진다.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '201': { description: inquiry thread }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /me/inquiries:
    get:
      summary: 내 상품 문의 목록
      description: 내가 보낸 문의와 내 상품에 들어온 문의를 최근 대화순으로 함께 반환한다. 각 항목의 `role`이 내 입장, `unread`가 아직 읽지 않은 상대 메시지 수다.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: inquiry threads with next_cursor }
  /inquiries/{id}/messages:
    get:
      summary: 문의 대화 내용
      description: 당사자 두 사람만 볼 수 있다. 열람하면 상대가 보낸 메시지가 읽음으로 표시된다.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: messages in the thread }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: 문의 답장
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '201': { description: message sent }
        '403': { $ref: '#/components/responses/Error' }
  /talents/{id}/reviews:
    get:
      summary: 상품 후기 목록과 점수 분포
      description: 인증 없이 열람할 수 있다. 첫 페이지에만 `summary`(건수·항목별 평균·1~5점 분포·재의뢰 의향 비율)를 함께 반환하며, 구매자 이름은 가운데를 가려 표시한다. 공개되지 않은 상품은 404를 돌려준다.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: reviews with next_cursor and a summary }
        '404': { $ref: '#/components/responses/Error' }
  /talents/{id}/favorite:
    post:
      summary: 상품 찜하기
      description: 공개된 상품만 찜할 수 있으며 같은 상품을 여러 번 눌러도 개수는 한 번만 올라간다.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: favourite state and count }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: 찜 해제
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: favourite state and count }
  /files/{id}:
    get:
      security: []
      summary: 파일 내려받기
      description: 공개 표시된 파일은 누구나 받을 수 있고, 그 외에는 소유자와 주문 당사자, 운영 권한자만 받을 수 있다.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: file content }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error' }
  /sellers/{id}:
    get:
      security: []
      summary: 공개 판매자 프로필
      description: 공개된 상품이 하나라도 있는 활성 판매자만 반환한다. 소개와 자기소개를 제외한 모든 수치는 완료된 거래에서 계산하며, 이메일·아이디·동시 처리 한도 같은 비공개 정보는 포함하지 않는다.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: public seller profile }
        '404': { $ref: '#/components/responses/Error' }
  /sellers/{id}/reviews:
    get:
      security: []
      summary: 판매자의 모든 후기
      description: 판매자의 전체 상품에 달린 후기를 최신순 커서 페이징으로 반환한다. 각 항목에 어느 상품인지와 판매자 답글이 함께 온다.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: reviews with next_cursor }
        '404': { $ref: '#/components/responses/Error' }
  /sellers/{id}/talents:
    get:
      security: []
      summary: 판매자의 공개 상품 목록
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: published talents }
  /sellers/{id}/portfolios:
    get:
      security: []
      summary: 판매자 공개 포트폴리오
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: portfolios }
  /organizations:
    post:
      summary: 조직 만들기
      description: 만든 사람이 소유자가 된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                slug: { type: string }
      responses:
        '201': { description: created with the caller as owner }
        '409': { $ref: '#/components/responses/Error' }
  /organizations/{id}:
    get:
      summary: 조직 상세와 구성원, 예산, 지출 요약
      description: 구성원이 아니면 존재 자체를 알리지 않고 404를 반환한다.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: organization detail }
        '404': { $ref: '#/components/responses/Error' }
  /organizations/{id}/orders:
    get:
      summary: 조직 명의 주문
      description: 관리자와 소유자는 전체를, 구성원은 자신이 만든 주문만 본다.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: organization orders with next_cursor }
  /organizations/{id}/members:
    post:
      summary: 구성원 추가
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account]
              properties:
                account: { type: string, description: 아이디 또는 이메일 }
                role: { type: string, enum: [owner, admin, member], default: member }
      responses:
        '201': { description: member added }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /organizations/{id}/members/{userId}:
    patch:
      summary: 구성원 역할 변경
      description: 마지막 소유자의 역할은 변경할 수 없다.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [owner, admin, member] }
      responses:
        '200': { description: updated }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      summary: 구성원 제거
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: removed }
        '409': { $ref: '#/components/responses/Error' }
  /organizations/{id}/budgets:
    post:
      summary: 예산 추가
      description: 주문 시점에 차감되고 취소·환불되면 되돌아온다.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, amount]
              properties:
                name: { type: string, maxLength: 100 }
                amount: { type: integer, minimum: 1 }
                currency: { type: string, default: KRW }
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time }
      responses:
        '201': { description: created }
        '400': { $ref: '#/components/responses/Error' }
  /reports:
    post:
      summary: 신고 접수
      description: 같은 신고자가 같은 대상에 대해 처리 중인 신고를 중복 접수할 수 없다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource_type, resource_id, reason]
              properties:
                resource_type: { type: string, enum: [talent, user, order, message] }
                resource_id: { type: string, format: uuid }
                reason: { type: string, enum: [fraud, inappropriate, spam, copyright, impersonation, other] }
                details: { type: string, maxLength: 4000 }
                evidence: { type: array, maxItems: 10, items: { type: object } }
      responses:
        '201': { description: report accepted }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /coupons/preview:
    post:
      summary: 쿠폰 적용 미리보기
      description: 주문에 적용될 실제 할인액을 주문 생성과 동일한 규칙으로 계산한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, talent_id]
              properties:
                code: { type: string }
                talent_id: { type: string, format: uuid }
                package_id: { type: string, format: uuid }
      responses:
        '200': { description: discount and payable amount }
        '409': { $ref: '#/components/responses/Error' }
  /quotes/{id}/accept:
    post:
      summary: 견적 선택과 주문 생성
      description: 견적 금액과 납기로 주문을 만들고 나머지 견적과 요청을 종료한다. 견적에 상품이 연결되어 있어야 한다.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                requirements: { type: object }
                coupon_code: { type: string }
                organization_id: { type: string, format: uuid }
      responses:
        '201': { description: order created from the quote }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /recommendations:
    get:
      security: []
      summary: 요구사항과 예산 기반 상품 추천
      description: matching.weights 중 측정 가능한 요소만 사용하며 요소별 기여도를 components로 함께 반환한다.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: budget_max, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200': { description: ranked talents with per-factor contributions and an explanation }
  /rfqs:
    get:
      summary: 접근 가능한 견적 프로젝트
      description: 구매자는 자신이 등록한 요청을, 판매자는 공개 요청을 함께, `orders.manage` 권한자는 전체를 최신순 커서 페이징으로 본다.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: RFQs with next_cursor }
    post:
      summary: Smart RFQ 등록
      responses:
        '201': { description: RFQ created }
  /rfqs/{id}/quotes:
    get:
      summary: RFQ 견적 비교
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: quotes ranked by match, price and delivery }
  /quotes:
    post:
      summary: 판매자 견적 제출
      responses:
        '201': { description: quote submitted }
  /admin/dashboard:
    get:
      summary: 운영 KPI와 예외 수
      responses:
        '200': { description: operations dashboard }
  /admin/talents:
    get:
      summary: 전체 상태의 상품 운영 목록
      description: 최근 변경순 커서 페이징. 정렬 키가 바뀔 수 있으므로 페이징 중 수정된 상품은 뒤쪽 페이지에 다시 나올 수 있다.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: 상품명 또는 판매자 이름 일부 }
        - { name: status, in: query, schema: { type: string, enum: [draft, review, published, paused, rejected, archived] } }
        - { name: seller, in: query, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: talents with next_cursor }
  /admin/orders:
    get:
      summary: 전체 주문 운영 목록
      description: 조건은 서로 겹쳐서 적용된다. 알 수 없는 `state` 값은 무시한다.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: 주문 번호 앞부분 또는 상품명 일부 }
        - { name: user, in: query, schema: { type: string, format: uuid }, description: 구매자 또는 판매자가 이 계정인 주문 }
        - { name: state, in: query, schema: { type: string }, description: 주문 상태 또는 `OPEN`(종료되지 않은 전부) }
        - { name: overdue, in: query, schema: { type: string, enum: ['1'] }, description: 납기를 넘긴 미종료 주문만 }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: orders with next_cursor }
  /admin/users:
    get:
      summary: 사용자 운영 목록
      parameters:
        - { name: q, in: query, schema: { type: string }, description: 아이디·이메일·표시 이름 부분 일치 }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: users with roles and next_cursor }
  /admin/settlements:
    get:
      summary: 전체 정산 목록
      parameters:
        - { name: q, in: query, schema: { type: string }, description: 주문 번호 앞부분 또는 판매자 이름 일부 }
        - { name: state, in: query, schema: { type: string, enum: [scheduled, confirmed, hold, completed, cancelled] } }
        - { name: seller, in: query, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: settlements with next_cursor }
  /admin/settlements/{id}/action:
    post:
      summary: 정산 보류·해제·지급 완료
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: applied }
        '409': { $ref: '#/components/responses/Error' }
  /admin/orders/{id}:
    get:
      summary: 주문 사건 상세
      description: 요구사항, 주문 이력, 납품물, 두 사람의 대화(최근 100건), 분쟁 이력, 그리고 지금 기준 금액(결제·에스크로·환불·정산)을 한 번에 반환한다.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: everything about one order }
        '404': { $ref: '#/components/responses/Error' }
  /admin/ai/usage:
    get:
      summary: 이번 달 AI 사용량과 예산
      description: 기록된 토큰과 추정 비용을 월 예산과 함께 반환한다. 예산이 0이면 강제하지 않는다.
      responses:
        '200': { description: monthly spend, budget and per feature breakdown }
  /admin/risk:
    get:
      summary: 위험·분쟁·정산 보류 예외 대기열
      description: 자원별 최신 평가만 반환하며 각 항목은 점수를 만든 신호 목록을 포함한다. 같은 등급 안에서는 점수가 높은 순으로 정렬한다.
      parameters:
        - { name: level, in: query, schema: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] } }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: latest risk score per resource with order context }
  /orders/{id}/disputes:
    get:
      summary: 주문의 분쟁 목록
      description: 당사자와 운영자, 조직 명의 주문의 소유자·관리자가 열람합니다.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: disputes for the order }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: 분쟁 접수
      description: 주문을 DISPUTED로 바꾸고 예정된 정산을 보류한다. 한 주문에 열린 분쟁은 하나만 존재한다.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 2000 }
                evidence: { type: array, items: { type: object } }
      responses:
        '201': { description: dispute opened }
        '409': { $ref: '#/components/responses/Error' }
  /admin/users/{id}/mfa:
    delete:
      summary: 사용자 MFA 초기화
      description: 인증 앱을 잃은 계정의 복구 경로다. 등록된 인증 수단을 제거하고 해당 계정의 세션을 폐기한다.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: reset with the number of removed factors }
        '404': { $ref: '#/components/responses/Error' }
  /admin/users/{id}:
    get:
      summary: 사용자 조사 화면 데이터
      description: 한 계정의 신원, 역할, MFA·세션·API 키, 구매·판매 집계, 결제와 정산 금액, 분쟁·신고를 양쪽 관점에서, 소속 조직과 최근 작업 10건을 한 번에 반환한다. 모든 수치는 기록에서 계산한다.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: everything known about one account }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: 사용자 상태와 표시 이름 변경
      description: 현재 로그인한 관리자 본인의 계정은 정지할 수 없다.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: updated }
        '409': { $ref: '#/components/responses/Error' }
  /admin/users/{id}/roles:
    put:
      summary: 사용자 역할 지정
      description: 본인 계정에서 Super Admin 역할을 제거할 수 없다.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: roles replaced }
        '409': { $ref: '#/components/responses/Error' }
  /admin/users/{id}/api-keys:
    get:
      summary: 사용자의 API 키 목록
      description: "`keys.manage.any` 권한이 필요하다. 키 원문은 생성 시 한 번만 보여주고 저장은 해시로 하므로 이 목록에는 포함되지 않는다."
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: api keys without their secrets }
  /admin/api-keys/{id}:
    delete:
      summary: 다른 사용자의 API 키 폐기
      description: 유출된 키를 소유자를 기다리지 않고 끊기 위한 경로다. 이미 폐기된 키는 404를 돌려준다.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: key revoked }
        '404': { $ref: '#/components/responses/Error' }
  /admin/roles:
    get:
      summary: 역할과 권한 목록
      responses:
        '200': { description: roles with their permissions and the permission catalogue }
  /admin/roles/{code}/permissions:
    put:
      summary: 역할의 권한 재지정
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: permissions replaced }
  /admin/approvals/requests/{id}:
    get:
      summary: 승인 검토 대상 상세
      description: 요청 자체는 제목만 담고 있으므로 대상 자원을 현재 상태로 읽어 함께 반환한다. 상품 공개 요청이면 설명, 가격, 패키지, 태그, 환불 정책과 판매자 이력(공개 상품 수, 반려 이력, 이 계정에 대한 신고)이다. 같은 자원에 대한 이전 결재도 포함한다.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: the request and what it would publish }
        '404': { $ref: '#/components/responses/Error' }
  /admin/approvals/requests/{id}/decision:
    post:
      summary: 승인 요청 결재
      description: 정책이 정한 단계 순서대로 승인하거나 반려한다.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: decision recorded }
        '409': { $ref: '#/components/responses/Error' }
  /analytics/csp-report:
    post:
      security: []
      summary: 콘텐츠 보안 정책 위반 신고 수신
      description: 방문 추적이 켜진 동안 브라우저가 정책에 막힌 출처를 보고하는 곳이다. 출처와 지시어만 메모리에 최대 100건 기억하며, 본문은 8KB로 제한한다. 항상 204를 돌려준다.
      responses:
        '204': { description: report accepted }
  /admin/analytics/violations:
    get:
      summary: 정책에 막힌 출처 목록
      description: 추적 스니펫이 불러오려다 막힌 출처를 지시어와 함께 보여 준다. 지금 설정이 이미 허용하는 출처는 allowed 로 표시된다.
      responses:
        '200': { description: blocked origins, most recent first }
    delete:
      summary: 막힌 출처 기록 비우기
      responses:
        '204': { description: records cleared }
  /admin/analytics/violations/allow:
    post:
      summary: 막힌 출처를 허용 목록에 추가
      description: analytics.tracking 의 allowed_hosts 에 출처 하나를 더하고 감사 기록을 남긴다.
      responses:
        '200': { description: updated allow list }
        '400': { $ref: '#/components/responses/Error' }
  /admin/mail/deliveries:
    get:
      summary: 메일 발송 기록
      description: 사내 SMTP 릴레이로 나간 알림 메일을 시도마다 보여 준다(언제·어떤 이벤트·누구에게·제목·상태·오류). 본문은 기록에 담지 않으며 돌려주지도 않는다.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [queued, sending, retry, sent, failed] } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
      responses:
        '200': { description: deliveries newest first with a per-status summary }
  /admin/mail/test:
    post:
      summary: 시험 발송
      description: 저장된 mail 설정으로 실제 한 통을 보내고 결과를 바로 돌려준다. 받는 사람을 비우면 요청한 관리자의 주소로 보낸다. 성공·실패 모두 발송 기록에 남는다.
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { recipient: { type: string, format: email } } }
      responses:
        '200': { description: sent }
        '400': { $ref: '#/components/responses/Error' }
        '409': { description: mail.enabled is off }
        '502': { description: the relay refused or could not be reached; the error message names the SMTP step }
  /admin/settings:
    get:
      summary: 중앙 운영 설정 목록
      responses:
        '200': { description: settings with redacted secrets }
  /admin/settings/{key}:
    put:
      summary: 운영 설정 낙관적 버전 변경
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: setting updated }
        '409': { $ref: '#/components/responses/Error' }
  /admin/auth-providers:
    get:
      summary: 로그인 제공자 설정 목록
      responses:
        '200': { description: providers with redacted secrets }
    post:
      summary: Google, Naver, Apple, Kakao, Keycloak 또는 custom 제공자 추가
      responses:
        '201': { description: provider created }
  /admin/auth-providers/{id}:
    put:
      summary: 로그인 제공자 설정 및 활성 상태 변경
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: provider updated }
    delete:
      summary: 연결 계정이 없는 로그인 제공자 삭제
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: provider deleted }
        '409': { $ref: '#/components/responses/Error' }
  /admin/approvals/policies:
    get:
      summary: 승인 정책 목록
      responses:
        '200': { description: approval policies }
    post:
      summary: 승인 정책 추가
      responses:
        '201': { description: approval policy created }
  /admin/approvals/policies/{id}:
    put:
      summary: 승인 정책과 적용 조건 변경
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: approval policy updated }
    delete:
      summary: 처리 이력이 없는 승인 정책 삭제
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: approval policy deleted }
        '409': { $ref: '#/components/responses/Error' }
  /admin/approvals/requests:
    get:
      summary: 승인 대기열
      description: 대기 중인 요청은 접수가 오래된 순, 처리된 요청은 최근 순으로 정렬한다. 각 행은 `waiting_hours`를, 응답은 `sla_hours`를 함께 반환한다.
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [pending, approved, rejected] } }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: approval requests with waiting time and the SLA }
  /admin/feature-flags:
    get:
      summary: 기능 플래그 목록
      responses:
        '200': { description: switches that gate shipped behaviour }
  /admin/feature-flags/{key}:
    put:
      summary: 기능 플래그 변경
      description: 끄면 해당 기능의 API가 404로 거부된다.
      parameters: [{ name: key, in: path, required: true, schema: { type: string, enum: [ai_matching, smart_quote, enterprise, agent_marketplace] } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200': { description: updated }
        '404': { $ref: '#/components/responses/Error' }
  /admin/notes:
    get:
      summary: 대상별 운영 메모
      description: 고정 메모가 먼저, 그다음 최신순이다. 모든 운영자가 같은 메모를 본다.
      parameters:
        - { name: subject_type, in: query, required: true, schema: { type: string, enum: [user, order, talent, dispute] } }
        - { name: subject_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: notes with their authors }
        '400': { $ref: '#/components/responses/Error' }
    post:
      summary: 운영 메모 남기기
      description: 조치했다는 기록이 아니라 판단과 그 이유를 남기는 자리다. 조치하지 않기로 한 결정도 포함한다.
      responses:
        '201': { description: note created }
        '400': { $ref: '#/components/responses/Error' }
  /admin/notes/{id}:
    delete:
      summary: 내가 남긴 운영 메모 삭제
      description: 작성자만 삭제할 수 있다. 다른 운영자의 판단을 대신 지울 수는 없다.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: note removed }
        '403': { $ref: '#/components/responses/Error' }
  /admin/audit:
    get:
      summary: 불변 관리자 감사로그
      description: 커서 페이지네이션을 사용한다. 응답의 next_cursor가 null이면 마지막 페이지다. 조건은 서로 겹쳐서 적용되며, 알 수 없는 값은 무시하지 않고 그대로 걸러 빈 결과를 돌려준다.
      parameters:
        - { name: actor, in: query, schema: { type: string, format: uuid }, description: 이 계정이 한 작업만 반환한다. }
        - { name: action, in: query, schema: { type: string }, description: "작업 이름 접두사. `order`는 order.transition, order.create를 모두 포함한다." }
        - { name: resource_type, in: query, schema: { type: string }, description: 예 coupon, order, setting }
        - { name: resource_id, in: query, schema: { type: string, format: uuid } }
        - { name: result, in: query, schema: { type: string, enum: [success, failure] } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: audit events with next_cursor }
  /admin/risk/rescan:
    post:
      summary: 위험 평가와 정산 예정 처리 즉시 실행
      description: 다음 주기를 기다리지 않고 규칙을 다시 적용한다. 디스패처가 없는 프로세스에서는 503을 반환한다.
      responses:
        '200': { description: number of changed scores and processed settlements }
        '503': { $ref: '#/components/responses/Error' }
  /admin/reports:
    get:
      summary: 신고 대기열
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [open, reviewing, resolved] } }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: reports with resource context and repeat counts }
  /admin/reports/{id}:
    get:
      summary: 신고 사건 상세
      description: 신고된 대상을 종류에 맞게 펼쳐서 돌려준다. 상품이면 설명과 판매자, 계정이면 소개와 거래 수, 주문이면 당사자와 상태, 메시지면 본문과 발신자다. 신고자의 접수 이력과 같은 대상에 접수된 다른 신고도 함께 온다.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: the report, what it is about, and the pattern around it }
        '404': { $ref: '#/components/responses/Error' }
  /admin/reports/{id}/resolve:
    post:
      summary: 신고 처리
      description: 선택한 조치를 신고 상태 변경과 같은 트랜잭션에서 실제로 적용한다.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [dismiss, warn, hide_talent, suspend_user] }
                note: { type: string }
      responses:
        '200': { description: resolved with the applied action }
        '409': { $ref: '#/components/responses/Error' }
  /admin/talents/{id}/status:
    post:
      summary: 상품 공개 상태 변경
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [published, paused, archived] }
                note: { type: string }
      responses:
        '200': { description: updated }
        '404': { $ref: '#/components/responses/Error' }
  /admin/coupons:
    get:
      summary: 쿠폰 목록과 사용 통계
      parameters: [{ $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { description: coupons with redemption counts and committed promotion spend }
    post:
      summary: 쿠폰 발행
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CouponInput' }
      responses:
        '201': { description: created }
        '409': { $ref: '#/components/responses/Error' }
  /admin/coupons/{id}:
    put:
      summary: 쿠폰 수정
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CouponInput' }
      responses:
        '200': { description: updated }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: 쿠폰 사용 중단
      description: 사용 기록을 남기기 위해 삭제하지 않고 비활성화한다.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: deactivated }
        '404': { $ref: '#/components/responses/Error' }
  /admin/disputes:
    get:
      summary: 분쟁 대기열
      description: 미해결 분쟁은 접수가 오래된 순, 처리된 분쟁은 최근 순으로 정렬한다. 각 행은 `waiting_hours`를, 응답은 `sla_hours`를 함께 반환한다.
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [open, under_review, resolved] } }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: disputes with order context, waiting time and the SLA }
  /admin/disputes/{id}:
    get:
      summary: 분쟁 사건 상세
      description: 결정에 필요한 것을 한 번에 모아 돌려준다. 신청자와 그 입장, 주문 이력, 납품물, 두 사람의 대화(최근 100건), 양쪽의 과거 분쟁 이력, 그리고 금액이다. 금액은 `escrow`(지금 에스크로에 있는 것)와 `reclaimable`(이 분쟁을 처리하면 되돌릴 수 있는 것)을 구분한다. 구매확정된 주문은 에스크로가 비고 정산에 들어가 있으므로 두 값이 다르다.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: everything the decision rests on }
        '404': { $ref: '#/components/responses/Error' }
  /admin/disputes/{id}/resolve:
    post:
      summary: 분쟁 처리
      description: 기록된 정산을 원장에서 되돌리고 환불과 판매자 몫을 다시 기록한다. 이미 지급 완료된 정산은 거부한다.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [refund_full, refund_partial, release_to_seller] }
                refund_amount: { type: integer, description: 부분 환불 금액. 0보다 크고 결제 금액보다 작아야 한다. }
                note: { type: string }
      responses:
        '200': { description: resolved with the resulting order state and split }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/events:
    get:
      summary: 이벤트 아웃박스 상태
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, retry, processing, done, failed] } }
        - { name: event_type, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: events with a dispatch summary }
  /admin/events/{id}/retry:
    post:
      summary: 실패한 이벤트 재처리
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: requeued }
        '404': { $ref: '#/components/responses/Error' }
  /admin/events/deliveries:
    get:
      summary: 전체 웹훅 전달 이력
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [pending, retry, sending, delivered, failed] } }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: delivery attempts across owners }
  /admin/events/deliveries/{id}/retry:
    post:
      summary: 웹훅 전달 재전송
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: requeued }
        '404': { $ref: '#/components/responses/Error' }
  /admin/notifications/templates:
    get:
      summary: 알림 템플릿 목록
      responses:
        '200': { description: templates }
  /admin/notifications/templates/{key}:
    put:
      summary: 알림 템플릿 변경
      parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body_template]
              properties:
                channel: { type: string, default: web }
                locale: { type: string, default: ko-KR }
                subject_template: { type: string }
                body_template: { type: string, description: '{{order_number}} 형식의 이벤트 변수를 사용한다.' }
                enabled: { type: boolean }
      responses:
        '200': { description: saved }
        '400': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    cookieSession: { type: apiKey, in: cookie, name: kkiit_session }
    bearerApiKey: { type: http, scheme: bearer }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1 }, description: 반환 최대 건수 }
    Cursor: { name: cursor, in: query, schema: { type: string }, description: 이전 응답의 next_cursor. 만료되거나 잘못된 값은 최신 페이지로 되돌아간다. }
  responses:
    Error:
      description: API error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
  schemas:
    WebhookInput:
      type: object
      required: [name, target_url, events]
      properties:
        name: { type: string, maxLength: 100 }
        target_url: { type: string, format: uri, maxLength: 500 }
        events:
          type: array
          minItems: 1
          description: 구독할 이벤트 유형. '*'는 전체 구독을 뜻한다.
          items: { type: string }
        enabled: { type: boolean, default: true }
        rotate_secret: { type: boolean, default: false, description: 변경 시 서명 키를 재발급한다. }
    PortfolioInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 2, maxLength: 160 }
        description: { type: string, maxLength: 4000 }
        media:
          type: array
          maxItems: 12
          items:
            type: object
            properties:
              url: { type: string }
              name: { type: string }
              mime_type: { type: string }
        tags: { type: array, maxItems: 20, items: { type: string } }
    CouponInput:
      type: object
      required: [code, name, discount_type, discount_value]
      properties:
        code: { type: string, minLength: 3, maxLength: 40 }
        name: { type: string, maxLength: 100 }
        discount_type: { type: string, enum: [percent, fixed] }
        discount_value: { type: integer, minimum: 1 }
        min_order_amount: { type: integer, minimum: 0 }
        max_discount_amount: { type: integer, minimum: 1 }
        usage_limit: { type: integer, minimum: 1 }
        per_user_limit: { type: integer, minimum: 0, default: 1 }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        active: { type: boolean }
